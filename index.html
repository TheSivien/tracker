<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b5bf0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tracker Pengeluaran</title>
<style>
:root{--bg:#f3f4f9;--card:#fff;--tx:#161a2b;--mut:#7a8199;--bd:#e6e9f2;--pri:#5b5bf0;--pri2:#8b5cf6;--red:#e11d48;--green:#16a34a;--sh:0 4px 20px rgba(30,40,90,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1118;--card:#171b26;--tx:#eceff8;--mut:#8b93ab;--bd:#262c3c;--pri:#7c7cff;--pri2:#a78bfa;--red:#fb7185;--green:#4ade80;--sh:0 4px 20px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px 16px 150px;min-height:100vh}
.center{display:grid;place-items:center;min-height:60vh;color:var(--mut);text-align:center;padding:20px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:var(--tx)}
h1,h2,h3{margin:0}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px}
.top h1{font-size:20px}
.sync{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:5px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
.sync.p i{background:#f59e0b}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:12px}
.mut{color:var(--mut);font-size:13px}
.sel{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);margin-bottom:14px}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:0 10px 30px rgba(91,91,240,.35)}
.hero small{opacity:.85}
.hero .big{font-size:34px;font-weight:800;margin:4px 0}
.hero .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hero .c{background:rgba(255,255,255,.18);border-radius:99px;padding:5px 11px;font-size:13px}
.hero .nb{margin-top:14px;width:100%;background:#fff;color:var(--pri);font-weight:700;padding:11px;border-radius:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.st{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--sh)}
.st small{color:var(--mut);font-size:12px;display:block}
.st b{font-size:15px;display:block;margin:2px 0}
.st span{font-size:11px;color:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:3px;height:130px}
.bars .b{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}
.bars .b i{display:block;width:100%;background:linear-gradient(var(--pri2),var(--pri));border-radius:4px 4px 0 0;min-height:2px}
.bars .b.z i{background:var(--bd)}
.bars .b.t i{outline:2px solid #f59e0b}
.bars .b span{font-size:9px;color:var(--mut);height:12px;margin-top:3px}
.br{margin:10px 0}
.brh{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bar{height:7px;background:var(--bd);border-radius:4px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.donutw{display:flex;gap:16px;align-items:center}
.donut{width:120px;height:120px;border-radius:50%;flex:none;display:grid;place-items:center}
.donut div{width:78px;height:78px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;line-height:1.1}
.donut b{font-size:14px}.donut small{color:var(--mut);font-size:11px}
.leg{flex:1;font-size:13px;min-width:0}
.leg div{display:flex;justify-content:space-between;gap:6px;margin:3px 0}
.leg span{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.ins{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--bd);font-size:14px}
.ins:first-of-type{border-top:0}
.ins em{font-style:normal;font-size:20px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--tx);font-weight:700;box-shadow:var(--sh)}
.rrow{padding:10px 0;border-top:1px solid var(--bd)}
.rrow:first-child{border-top:0}
.rrow .h{display:flex;justify-content:space-between;gap:10px}
.rrow .h b{white-space:nowrap}
.dg{font-size:12px;font-weight:700;color:var(--mut);margin:14px 0 4px;display:flex;justify-content:space-between}
.it{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--bd);width:100%;text-align:left}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none;color:#fff;font-weight:700}
.it .m{flex:1;min-width:0}
.it .m b{display:block}
.it .r{text-align:right;font-weight:700;white-space:nowrap}
.x{color:var(--red);font-size:12px;padding:4px 8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:99px;border:1.5px solid var(--bd);margin:0 6px 8px 0;font-size:14px;background:var(--card)}
.pill.on{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 14%,transparent);font-weight:700}
.pill button{color:var(--red);font-size:16px;line-height:1;padding:0 0 0 2px}
.btn{width:100%;padding:13px;border-radius:13px;font-weight:700;border:1.5px solid var(--bd);background:var(--card);margin-top:8px}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0}
.btn.red{color:var(--red)}
.row{display:flex;gap:8px}
.row>input{flex:1;min-width:0}
.row>button{flex:none;width:auto;margin-top:0;padding:0 16px}
input[type=text],input[type=date],input[type=password]{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--bd);background:var(--bg)}
label.l{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
.nav div{display:flex;width:100%;max-width:560px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mut);padding:6px 0;gap:2px}
.nav button em{font-style:normal;font-size:20px}
.nav button.on{color:var(--pri);font-weight:700}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(76px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-size:30px;box-shadow:0 8px 24px rgba(91,91,240,.5);z-index:6;display:grid;place-items:center;padding-bottom:3px}
#sheet{display:none}
#sheet.open{display:block}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}
.sh{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));z-index:21;max-height:92vh;overflow:auto}
.grab{width:42px;height:4px;border-radius:2px;background:var(--bd);margin:0 auto 12px}
.sh h3{font-size:18px;margin-bottom:4px}
.amt{display:flex;align-items:center;gap:8px;border:1.5px solid var(--bd);border-radius:14px;padding:4px 14px;background:var(--bg)}
.amt span{color:var(--mut);font-weight:700}
.amt input{border:0;background:none;outline:0;font-size:26px;font-weight:800;width:100%;padding:8px 0}
.err{color:var(--red);font-size:13px;margin-top:8px}
.login{text-align:center;padding-top:60px}
.login h1{font-size:26px;margin-bottom:6px}
.who{display:flex;gap:14px;justify-content:center;margin:26px 0}
.who button{width:130px;padding:20px 10px;border-radius:20px;background:var(--card);box-shadow:var(--sh);border:2px solid transparent;font-weight:700}
.who button.on{border-color:var(--pri)}
.who em{display:grid;place-items:center;width:60px;height:60px;border-radius:50%;margin:0 auto 8px;font-style:normal;font-size:26px;color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2))}
.empty{text-align:center;color:var(--mut);padding:24px 0}
pre{white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:10px;font-size:12px;text-align:left}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, setDoc, updateDoc, collection, addDoc, deleteDoc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== ISI BAGIAN INI (dari Firebase Console) ====== */
const firebaseConfig = {
  apiKey: "AIzaSyDEOCtkBYVyfpMUEn1Gt0kjfGJDZqB9aqs",
  authDomain: "our-money-tracker.firebaseapp.com",
  projectId: "our-money-tracker",
  appId: "1:991339455679:web:3c54a5660d31c86786520a"
};
// Akun otomatis dibuat saat pertama kali dipilih. Password dipakai di balik layar (tidak perlu diketik).
// Ganti password di bawah dengan teks acak panjang milikmu sendiri (minimal 6 karakter).
const ACCOUNTS = {
  Hazim: { email: "hazim@tracker.app", pass: "123456" },
  Galun: { email: "galun@tracker.app", pass: "123456" }
};
/* ==================================================== */

const METHODS = { BCA:'#0060af', Mandiri:'#d99a00', Shopeepay:'#ee4d2d', Cash:'#16a34a', Gopay:'#00a5cf' };
const FALLBACK = 'Lainnya';
const DEFAULT_TYPES = ['Makan','Transport','Belanja','Tagihan','Hiburan','Kesehatan',FALLBACK];
const ICON = {Makan:'🍜',Transport:'🚗',Belanja:'🛍️',Tagihan:'🧾',Hiburan:'🎮',Kesehatan:'💊',Lainnya:'📦'};
const PALETTE = ['#6366f1','#f59e0b','#10b981','#ef4444','#06b6d4','#ec4899','#8b5cf6','#84cc16','#f97316','#14b8a6'];
const MONTHS = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const DAYS = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const P = s => { const [a,b,c] = s.split('-').map(Number); return new Date(a,b-1,c,12); };
const today = () => ymd(new Date());
const addDays = (s,n) => { const d = P(s); d.setDate(d.getDate()+n); return ymd(d); };
const diffDays = (a,b) => Math.round((P(b)-P(a))/864e5);
const weekStart = s => addDays(s, -((P(s).getDay()+6)%7));
const dShort = s => { const d = P(s); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const dFull = s => { const d = P(s); return `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const rp = n => 'Rp ' + Math.round(n).toLocaleString('id-ID');
const rpS = n => n>=1e6 ? (n/1e6).toFixed(n%1e6?1:0).replace('.',',')+'jt' : n>=1e3 ? Math.round(n/1e3)+'rb' : String(Math.round(n));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum = a => a.reduce((s,e) => s+e.amount, 0);
const hash = s => [...s].reduce((h,c) => (h*31 + c.charCodeAt(0)) >>> 0, 7);
const col = t => t===FALLBACK ? '#94a3b8' : PALETTE[hash(t) % PALETTE.length];
const icon = t => ICON[t] || (t.trim()[0]||'?').toUpperCase();
const group = (list, fn) => { const m = {}; list.forEach(e => { const k = fn(e); m[k] = (m[k]||0) + e.amount; }); return m; };

/* ---------- state ---------- */
let view = 'loading';
let ui = { tab:'home', viewIdx:0, recap:'day', filter:'', loginUser: localStorage.getItem('lastUser')||'', err:'' };
let state = { name:'', uid:'', periods:[], types:[], expenses:[], pending:false };
let form = null;
let unsubs = [];
let db, auth;

const periodIdxOf = date => { for (let i=state.periods.length-1;i>0;i--) if (date >= state.periods[i]) return i; return 0; };
const inP = (e,i) => { if (i>0 && e.date < state.periods[i]) return false; const nx = state.periods[i+1]; return !(nx && e.date >= nx); };
const periodStart = i => { if (i>0) return state.periods[i]; const ds = state.expenses.map(e=>e.date).concat(state.periods[0]); return ds.sort()[0]; };
const periodEnd = i => state.periods[i+1] ? addDays(state.periods[i+1],-1) : today();
const userRef = () => doc(db,'users',state.uid);
const expCol = () => collection(db,'users',state.uid,'expenses');

/* ---------- render ---------- */
function render(){
  if (view==='config') return app.innerHTML = configHTML();
  if (view==='loading') return app.innerHTML = '<div class="center">Memuat…</div>';
  if (view==='error') return app.innerHTML = `<div class="center">${ui.err}</div>`;
  if (view==='login') return app.innerHTML = loginHTML();
  ui.viewIdx = Math.max(0, Math.min(ui.viewIdx, state.periods.length-1));
  const tabs = [['home','🏠','Beranda'],['recap','📊','Rekap'],['hist','🧾','Riwayat'],['set','⚙️','Pengaturan']];
  const body = {home:homeHTML,recap:recapHTML,hist:histHTML,set:setHTML}[ui.tab]();
  app.innerHTML = `
    <div class="top"><h1>Halo, ${esc(state.name)} 👋</h1><div class="sync ${state.pending?'p':''}"><i></i>${state.pending?'Menyimpan…':'Tersinkron'}</div></div>
    ${body}
    <button class="fab" data-a="openAdd" aria-label="Tambah">+</button>
    <div class="nav"><div>${tabs.map(([k,e,l])=>`<button class="${ui.tab===k?'on':''}" data-a="tab" data-v="${k}"><em>${e}</em>${l}</button>`).join('')}</div></div>`;
}

function configHTML(){
  return `<div class="center"><div><h2>Setup belum selesai</h2><p>Buka <b>index.html</b>, lalu isi <b>firebaseConfig</b> dengan data dari Firebase Console (Project settings → Your apps → Web app).</p></div></div>`;
}

function loginHTML(){
  const names = Object.keys(ACCOUNTS);
  return `<div class="login"><h1>💸 Tracker Pengeluaran</h1><div class="mut">Pilih akun</div>
    <div class="who">${names.map(n=>`<button class="${ui.loginUser===n?'on':''}" data-a="pickUser" data-v="${n}"><em>${n[0]}</em>${n}</button>`).join('')}</div>
    ${ui.err?`<div class="err">${ui.err}</div>`:''}</div>`;
}

const barRow = (label,val,max,color,extra='') => `<div class="br"><div class="brh"><span>${label}</span><b>${rp(val)}${extra}</b></div><div class="bar"><i style="width:${max?val/max*100:0}%;background:${color}"></i></div></div>`;

function periodSelect(){
  const opts = state.periods.map((p,i)=>`<option value="${i}" ${i===ui.viewIdx?'selected':''}>Periode ${i+1} · ${dShort(periodStart(i))}${i===state.periods.length-1?' (aktif)':''}</option>`).reverse().join('');
  return `<select class="sel" data-c="viewIdx">${opts}</select>`;
}

function homeHTML(){
  const i = ui.viewIdx, isCur = i===state.periods.length-1;
  const L = state.expenses.filter(e=>inP(e,i));
  const total = sum(L), st = periodStart(i), en = periodEnd(i);
  const days = Math.max(1, diffDays(st,en)+1);
  const t = today();
  const all = state.expenses;
  const rangeSum = (a,b) => sum(all.filter(e=>e.date>=a && e.date<=b));
  const w0 = weekStart(t);
  const mk = t.slice(0,7);
  const lm = (()=>{ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); return ymd(d).slice(0,7); })();
  const todayT = rangeSum(t,t), yT = rangeSum(addDays(t,-1),addDays(t,-1));
  const weekT = rangeSum(w0,t), lwT = rangeSum(addDays(w0,-7),addDays(w0,-1));
  const monT = sum(all.filter(e=>e.date.slice(0,7)===mk)), lmT = sum(all.filter(e=>e.date.slice(0,7)===lm));

  let h = periodSelect();
  h += `<div class="hero"><small>Periode ${i+1}${isCur?' · aktif':''}</small><div class="big">${rp(total)}</div>
    <small>${dShort(st)} – ${isCur?'sekarang':dShort(en)} · ${days} hari</small>
    <div class="chips"><span class="c">≈ ${rpS(total/days)}/hari</span><span class="c">${L.length} transaksi</span></div>
    ${isCur?`<button class="nb" data-a="openPeriod">+ Mulai periode baru</button>`:''}</div>`;
  h += `<div class="grid3">
    <div class="st"><small>Hari ini</small><b>${rpS(todayT)}</b><span>Kemarin ${rpS(yT)}</span></div>
    <div class="st"><small>Minggu ini</small><b>${rpS(weekT)}</b><span>Lalu ${rpS(lwT)}</span></div>
    <div class="st"><small>Bulan ini</small><b>${rpS(monT)}</b><span>Lalu ${rpS(lmT)}</span></div></div>`;
  if (!L.length) return h + `<div class="card empty">Belum ada pengeluaran di periode ini.<br>Tekan + untuk menambah.</div>`;

  // chart harian
  const byDate = group(L,e=>e.date);
  const from = days>31 ? addDays(en,-30) : st;
  const n = diffDays(from,en)+1;
  const mx = Math.max(...Object.values(byDate),1);
  let bars = '';
  for (let k=0;k<n;k++){
    const d = addDays(from,k), v = byDate[d]||0;
    const lab = (n<=14 || k%5===0 || k===n-1) ? P(d).getDate() : '';
    bars += `<div class="b ${v?'':'z'} ${d===t?'t':''}" title="${dShort(d)}: ${rp(v)}"><i style="height:${v/mx*100}%"></i><span>${lab}</span></div>`;
  }
  h += `<div class="card"><h2>Pengeluaran harian${days>31?' (31 hari terakhir)':''}</h2><div class="bars">${bars}</div></div>`;

  // per tipe
  const byType = Object.entries(group(L,e=>e.type)).sort((a,b)=>b[1]-a[1]);
  let acc = 0;
  const stops = byType.map(([k,v])=>{ const s=acc/total*100; acc+=v; return `${col(k)} ${s}% ${acc/total*100}%`; }).join(',');
  h += `<div class="card"><h2>Per tipe</h2><div class="donutw"><div class="donut" style="background:conic-gradient(${stops})"><div><span><b>${rpS(total)}</b><br><small>total</small></span></div></div>
    <div class="leg">${byType.map(([k,v])=>`<div><span><i class="dot" style="background:${col(k)}"></i>${esc(k)}</span><b>${Math.round(v/total*100)}%</b></div>`).join('')}</div></div>
    <div style="margin-top:8px">${byType.map(([k,v])=>barRow(`${icon(k)} ${esc(k)}`,v,byType[0][1],col(k))).join('')}</div></div>`;

  // per metode
  const byMeth = Object.entries(group(L,e=>e.method)).sort((a,b)=>b[1]-a[1]);
  h += `<div class="card"><h2>Per metode</h2>${byMeth.map(([k,v])=>barRow(esc(k),v,byMeth[0][1],METHODS[k]||'#94a3b8')).join('')}</div>`;

  // per hari dalam minggu
  const wd = [1,2,3,4,5,6,0].map(d=>[DAYS[d], sum(L.filter(e=>P(e.date).getDay()===d))]);
  const wmx = Math.max(...wd.map(x=>x[1]),1);
  h += `<div class="card"><h2>Per hari dalam seminggu</h2><div class="bars" style="height:100px">${wd.map(([l,v])=>`<div class="b ${v?'':'z'}"><i style="height:${v/wmx*100}%"></i><span>${l}</span></div>`).join('')}</div></div>`;

  // sorotan
  const topDay = Object.entries(byDate).sort((a,b)=>b[1]-a[1])[0];
  const big = L.slice().sort((a,b)=>b.amount-a.amount);
  h += `<div class="card"><h2>Sorotan</h2>
    <div class="ins"><em>🔥</em><div>Hari terboros<br><b>${dFull(topDay[0])}</b> · ${rp(topDay[1])}</div></div>
    <div class="ins"><em>💎</em><div>Transaksi terbesar<br><b>${rp(big[0].amount)}</b> · ${esc(big[0].type)} (${dShort(big[0].date)})</div></div>
    <div class="ins"><em>🧮</em><div>Rata-rata per transaksi<br><b>${rp(total/L.length)}</b></div></div>
    <div class="ins"><em>📅</em><div>Hari aktif belanja<br><b>${Object.keys(byDate).length}</b> dari ${days} hari</div></div></div>`;
  h += `<div class="card"><h2>5 terbesar</h2>${big.slice(0,5).map(itemHTML).join('')}</div>`;
  return h;
}

function itemHTML(e){
  return `<button class="it" data-a="edit" data-id="${e.id}"><div class="ic" style="background:${col(e.type)}">${icon(e.type)}</div>
    <div class="m"><b>${esc(e.type)}</b><span class="mut">${esc(e.method)} · ${dShort(e.date)}</span></div><div class="r">${rp(e.amount)}</div></button>`;
}

function recapHTML(){
  const i = ui.viewIdx, L = state.expenses.filter(e=>inP(e,i));
  const mode = ui.recap;
  let rows = [], note = '';
  if (mode==='day'){
    const m = group(L,e=>e.date), c = {}; L.forEach(e=>c[e.date]=(c[e.date]||0)+1);
    rows = Object.keys(m).sort().reverse().map(d=>({label:dFull(d),sub:`${c[d]} transaksi`,total:m[d]}));
    note = `Periode ${i+1}`;
  } else if (mode==='week'){
    const m = group(L,e=>weekStart(e.date)), c = {}; L.forEach(e=>{const k=weekStart(e.date);c[k]=(c[k]||0)+1;});
    rows = Object.keys(m).sort().reverse().map(w=>({label:`${dShort(w)} – ${dShort(addDays(w,6))}`,sub:`${c[w]} transaksi`,total:m[w]}));
    note = `Periode ${i+1} · minggu Senin–Minggu`;
  } else if (mode==='month'){
    const m = group(state.expenses,e=>e.date.slice(0,7)), c = {}; state.expenses.forEach(e=>{const k=e.date.slice(0,7);c[k]=(c[k]||0)+1;});
    rows = Object.keys(m).sort().reverse().map(k=>({label:`${['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][+k.slice(5)-1]} ${k.slice(0,4)}`,sub:`${c[k]} transaksi`,total:m[k]}));
    note = 'Semua data';
  } else {
    rows = state.periods.map((p,k)=>{const l=state.expenses.filter(e=>inP(e,k));return {label:`Periode ${k+1}`,sub:`${dShort(periodStart(k))} – ${k===state.periods.length-1?'sekarang':dShort(periodEnd(k))} · ${l.length} transaksi`,total:sum(l)};}).reverse();
    note = 'Semua periode';
  }
  const mx = Math.max(...rows.map(r=>r.total),1), tot = sum(rows.map(r=>({amount:r.total})));
  const seg = [['day','Harian'],['week','Mingguan'],['month','Bulanan'],['period','Periode']].map(([k,l])=>`<button class="${mode===k?'on':''}" data-a="recap" data-v="${k}">${l}</button>`).join('');
  return `${mode==='day'||mode==='week'?periodSelect():''}<div class="seg">${seg}</div>
    <div class="card"><h2>Rekap · ${note}</h2>
    ${rows.length?`<div class="mut" style="margin:-4px 0 6px">Rata-rata ${rp(tot/rows.length)} per ${({day:'hari',week:'minggu',month:'bulan',period:'periode'})[mode]}</div>
    ${rows.map(r=>`<div class="rrow"><div class="h"><div>${r.label}<div class="mut">${r.sub}</div></div><b>${rp(r.total)}</b></div><div class="bar"><i style="width:${r.total/mx*100}%;background:var(--pri)"></i></div></div>`).join('')}`:'<div class="empty">Belum ada data.</div>'}</div>`;
}

function histHTML(){
  const i = ui.viewIdx;
  let L = state.expenses.filter(e=>inP(e,i));
  if (ui.filter) L = L.filter(e=>e.type===ui.filter);
  L.sort((a,b)=>b.date.localeCompare(a.date) || (b.createdAt||0)-(a.createdAt||0));
  const dates = [...new Set(L.map(e=>e.date))];
  const fsel = `<select class="sel" data-c="filter"><option value="">Semua tipe</option>${state.types.map(t=>`<option ${ui.filter===t?'selected':''}>${esc(t)}</option>`).join('')}</select>`;
  return periodSelect() + fsel + (dates.length ? dates.map(d=>{
    const day = L.filter(e=>e.date===d);
    return `<div class="card" style="padding:6px 16px 8px"><div class="dg"><span>${dFull(d)}</span><span>${rp(sum(day))}</span></div>${day.map(itemHTML).join('')}</div>`;
  }).join('') : '<div class="card empty">Tidak ada transaksi.</div>');
}

function setHTML(){
  const ps = state.periods.map((p,k)=>`<div class="rrow"><div class="h"><span>Periode ${k+1}</span><span class="mut">${dShort(periodStart(k))} – ${k===state.periods.length-1?'sekarang':dShort(periodEnd(k))}</span></div></div>`).reverse().join('');
  return `<div class="card"><h2>Akun</h2><div>Masuk sebagai <b>${esc(state.name)}</b></div><button class="btn" data-a="logout">Keluar</button></div>
  <div class="card"><h2>Periode</h2>${ps}<button class="btn pri" data-a="openPeriod">+ Mulai periode baru</button>
    ${state.periods.length>1?`<button class="btn red" data-a="undoPeriod">Batalkan periode terakhir</button>`:''}</div>
  <div class="card"><h2>Tipe pengeluaran</h2><div class="mut" style="margin-bottom:10px">Hapus tipe → pengeluarannya pindah ke "${FALLBACK}".</div>
    ${state.types.map(t=>`<span class="pill">${icon(t)} ${esc(t)}${t===FALLBACK?'':`<button data-a="delType" data-v="${esc(t)}">×</button>`}</span>`).join('')}
    <div class="row" style="margin-top:6px"><input type="text" id="sNew" placeholder="Tipe baru…"><button class="btn pri" data-a="addTypeS">Tambah</button></div></div>
  <div class="card"><h2>Data</h2><button class="btn" data-a="exportCsv">Export CSV</button></div>`;
}

/* ---------- sheets ---------- */
function showSheet(){
  sheetEl().innerHTML = form.kind==='exp' ? expenseSheet() : periodSheet();
  sheetEl().classList.add('open'); document.body.style.overflow='hidden';
}
const sheetEl = () => $('sheet');
function closeSheet(){ sheetEl().classList.remove('open'); sheetEl().innerHTML=''; document.body.style.overflow=''; form=null; }

function expenseSheet(){
  const f = form;
  return `<div class="ov" data-a="closeSheet"></div><div class="sh"><div class="grab"></div><h3>${f.id?'Edit':'Tambah'} pengeluaran</h3>
  <label class="l">Tanggal</label>
  <div class="seg"><button class="${f.dmode==='today'?'on':''}" data-a="dmode" data-v="today">Hari ini</button><button class="${f.dmode==='custom'?'on':''}" data-a="dmode" data-v="custom">Pilih tanggal</button></div>
  ${f.dmode==='custom'?`<input type="date" id="fDate" value="${f.date}" max="${today()}">`:''}
  <label class="l">Tipe</label>
  <div>${state.types.map(t=>`<button class="pill ${f.type===t?'on':''}" data-a="pickType" data-v="${esc(t)}">${icon(t)} ${esc(t)}</button>`).join('')}</div>
  <div class="row"><input type="text" id="fNew" placeholder="+ Tipe baru (jadi permanen)" value="${esc(f.newType)}"><button class="btn" data-a="addType">Tambah</button></div>
  <label class="l">Besaran</label>
  <div class="amt"><span>Rp</span><input id="fAmt" inputmode="numeric" placeholder="0" value="${f.amount}" autocomplete="off"></div>
  <div class="mut" id="fPrev" style="margin-top:4px">${f.amount?rp(f.amount):''}</div>
  <label class="l">Metode</label>
  <div>${Object.keys(METHODS).map(m=>`<button class="pill ${f.method===m?'on':''}" data-a="pickMethod" data-v="${m}"><i class="dot" style="background:${METHODS[m]}"></i>${m}</button>`).join('')}</div>
  ${f.err?`<div class="err">${f.err}</div>`:''}
  <button class="btn pri" data-a="saveExpense">Simpan</button>
  ${f.id?`<button class="btn red" data-a="delExp">Hapus pengeluaran</button>`:''}</div>`;
}

function periodSheet(){
  const f = form, last = state.periods[state.periods.length-1];
  const d = f.pmode==='today' ? today() : f.date;
  const n = state.expenses.filter(e=>e.date>=d).length;
  return `<div class="ov" data-a="closeSheet"></div><div class="sh"><div class="grab"></div><h3>Mulai periode baru</h3>
  <div class="mut">Periode aktif sekarang mulai ${dShort(last)}. Lupa klik di hari H? Pilih tanggal yang benar.</div>
  <label class="l">Mulai tanggal</label>
  <div class="seg"><button class="${f.pmode==='today'?'on':''}" data-a="pmode" data-v="today">Hari ini</button><button class="${f.pmode==='custom'?'on':''}" data-a="pmode" data-v="custom">Pilih tanggal</button></div>
  ${f.pmode==='custom'?`<input type="date" id="pDate" value="${f.date}" min="${addDays(last,1)}" max="${today()}">`:''}
  <div class="mut" style="margin-top:10px">Mulai <b>${dFull(d)}</b> · ${n} transaksi akan masuk periode baru.</div>
  ${f.err?`<div class="err">${f.err}</div>`:''}
  <button class="btn pri" data-a="savePeriod">Mulai periode baru</button></div>`;
}

/* ---------- actions ---------- */
const fail = e => { console.error(e); alert('Gagal menyimpan: ' + (e.message||e)); };
const A = {
  tab:d=>{ ui.tab=d.v; render(); window.scrollTo(0,0); },
  recap:d=>{ ui.recap=d.v; render(); },
  openAdd:()=>{
    form = {kind:'exp',id:null,dmode:'today',date:today(),type:localStorage.getItem('lastType')&&state.types.includes(localStorage.getItem('lastType'))?localStorage.getItem('lastType'):state.types[0],amount:'',method:localStorage.getItem('lastMethod')||'BCA',newType:'',err:''};
    showSheet();
  },
  edit:d=>{
    const e = state.expenses.find(x=>x.id===d.id); if(!e) return;
    form = {kind:'exp',id:e.id,dmode:e.date===today()?'today':'custom',date:e.date,type:e.type,amount:String(e.amount),method:e.method,newType:'',err:''};
    showSheet();
  },
  closeSheet,
  dmode:d=>{ form.dmode=d.v; if(d.v==='custom'&&!form.date) form.date=today(); showSheet(); },
  pickType:d=>{ form.type=d.v; showSheet(); },
  pickMethod:d=>{ form.method=d.v; showSheet(); },
  addType:()=>{
    const v = (form.newType||'').trim(); if(!v) return;
    const ex = state.types.find(t=>t.toLowerCase()===v.toLowerCase());
    if (ex) form.type = ex; else { addType(v); form.type = v; }
    form.newType=''; showSheet();
  },
  addTypeS:()=>{ const v=$('sNew').value.trim(); if(v){ const ex=state.types.find(t=>t.toLowerCase()===v.toLowerCase()); if(!ex) addType(v); render(); } },
  delType:async d=>{
    if(!confirm(`Hapus tipe "${d.v}"? Pengeluaran dengan tipe ini dipindah ke "${FALLBACK}".`)) return;
    const aff = state.expenses.filter(e=>e.type===d.v);
    state.types = state.types.filter(t=>t!==d.v); if(!state.types.includes(FALLBACK)) state.types.push(FALLBACK);
    aff.forEach(e=>e.type=FALLBACK);
    render();
    try{
      for (let i=0;i<aff.length;i+=400){ const b=writeBatch(db); aff.slice(i,i+400).forEach(e=>b.update(doc(db,'users',state.uid,'expenses',e.id),{type:FALLBACK})); b.commit().catch(fail); }
      updateDoc(userRef(),{types:state.types}).catch(fail);
    }catch(e){ fail(e); }
  },
  saveExpense:()=>{
    const amt = parseInt(form.amount,10), date = form.dmode==='today'?today():form.date;
    if(!amt){ form.err='Isi besaran dulu.'; return showSheet(); }
    if(!date){ form.err='Pilih tanggal.'; return showSheet(); }
    const data = {date,type:form.type,amount:amt,method:form.method};
    localStorage.setItem('lastType',form.type); localStorage.setItem('lastMethod',form.method);
    if (form.id) updateDoc(doc(db,'users',state.uid,'expenses',form.id),data).catch(fail);
    else addDoc(expCol(),{...data,createdAt:Date.now()}).catch(fail);
    ui.viewIdx = periodIdxOf(date);
    closeSheet(); render();
  },
  delExp:()=>{ if(!confirm('Hapus pengeluaran ini?')) return; deleteDoc(doc(db,'users',state.uid,'expenses',form.id)).catch(fail); closeSheet(); },
  openPeriod:()=>{ form={kind:'per',pmode:'today',date:today(),err:''}; showSheet(); },
  pmode:d=>{ form.pmode=d.v; form.err=''; showSheet(); },
  savePeriod:()=>{
    const last = state.periods[state.periods.length-1], d = form.pmode==='today'?today():form.date;
    if(!d) { form.err='Pilih tanggal.'; return showSheet(); }
    if(d>today()){ form.err='Tanggal tidak boleh di masa depan.'; return showSheet(); }
    if(d<=last){ form.err=`Tanggal harus setelah awal periode aktif (${dShort(last)}).`; return showSheet(); }
    state.periods = [...state.periods,d]; ui.viewIdx = state.periods.length-1;
    updateDoc(userRef(),{periods:state.periods}).catch(fail);
    closeSheet(); render();
  },
  undoPeriod:()=>{
    if(!confirm('Batalkan periode terakhir? Transaksinya digabung kembali ke periode sebelumnya.')) return;
    state.periods = state.periods.slice(0,-1); ui.viewIdx = state.periods.length-1;
    updateDoc(userRef(),{periods:state.periods}).catch(fail); render();
  },
  logout:()=>signOut(auth),
  pickUser:async d=>{
    ui.loginUser=d.v; ui.err=''; view='loading'; render();
    const {email,pass} = ACCOUNTS[d.v];
    try{
      try{ await signInWithEmailAndPassword(auth,email,pass); }
      catch(e){
        // akun belum ada → buat otomatis
        if (['auth/invalid-credential','auth/user-not-found','auth/invalid-login-credentials'].includes(e.code)) await createUserWithEmailAndPassword(auth,email,pass);
        else throw e;
      }
      localStorage.setItem('lastUser',d.v);
    }catch(e){
      console.error(e); view='login';
      ui.err = e.code==='auth/email-already-in-use' ? 'Password di file tidak cocok dengan akun yang sudah ada.' :
               e.code==='auth/operation-not-allowed' ? 'Aktifkan Email/Password di Firebase → Authentication → Sign-in method.' :
               'Gagal masuk: '+esc(e.code||e.message||e);
      render();
    }
  },
  exportCsv:()=>{
    const q = v => `"${String(v).replace(/"/g,'""')}"`;
    const rows = [['Tanggal','Tipe','Metode','Jumlah','Periode']].concat(state.expenses.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>[e.date,e.type,e.method,e.amount,'Periode '+(periodIdxOf(e.date)+1)]));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));
    a.download = `pengeluaran-${state.name}-${today()}.csv`; a.click();
  }
};
function addType(v){
  const t = state.types.slice(); const i = t.indexOf(FALLBACK);
  t.splice(i<0?t.length:i,0,v); state.types = t;
  updateDoc(userRef(),{types:t}).catch(fail);
}

const app = $('app');
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if(!el) return;
  e.preventDefault(); const f = A[el.dataset.a]; if(f) f(el.dataset, el);
});
document.addEventListener('input', e => {
  if (e.target.id==='fAmt'){ const v=e.target.value.replace(/\D/g,''); e.target.value=v; form.amount=v; $('fPrev').textContent = v?rp(v):''; }
  else if (e.target.id==='fNew') form.newType = e.target.value;
});
document.addEventListener('change', e => {
  const c = e.target.dataset.c;
  if (c==='viewIdx'){ ui.viewIdx=+e.target.value; render(); }
  else if (c==='filter'){ ui.filter=e.target.value; render(); }
  else if (e.target.id==='fDate') form.date = e.target.value;
  else if (e.target.id==='pDate'){ form.date = e.target.value; form.err=''; showSheet(); }
});

/* ---------- firebase ---------- */
if (firebaseConfig.apiKey === 'ISI_DISINI'){ view='config'; render(); }
else {
  const fbApp = initializeApp(firebaseConfig);
  auth = getAuth(fbApp);
  db = initializeFirestore(fbApp, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  let loaded = {u:false,x:false};
  const ready = () => {
    if (loaded.u && loaded.x){
      if (view!=='app'){ view='app'; ui.viewIdx = state.periods.length-1; }
      render();
    }
  };
  const onErr = e => { console.error(e); view='error'; ui.err='Tidak bisa membaca data. Cek Firestore rules & koneksi.<br><small>'+esc(e.message||e)+'</small>'; render(); };
  onAuthStateChanged(auth, user => {
    unsubs.forEach(f=>f()); unsubs=[]; loaded={u:false,x:false};
    if (!user){ view='login'; state={name:'',uid:'',periods:[],types:[],expenses:[],pending:false}; render(); return; }
    state.uid = user.uid;
    state.name = Object.keys(ACCOUNTS).find(k=>ACCOUNTS[k].email===user.email) || user.email;
    view='loading'; render();
    unsubs.push(onSnapshot(userRef(), snap => {
      if (!snap.exists()){ setDoc(userRef(),{periods:[today()],types:DEFAULT_TYPES}).catch(onErr); return; }
      const d = snap.data();
      state.periods = [...d.periods].sort();
      state.types = d.types && d.types.length ? d.types : DEFAULT_TYPES;
      loaded.u = true; ready();
    }, onErr));
    unsubs.push(onSnapshot(expCol(), snap => {
      state.expenses = snap.docs.map(d=>({id:d.id,...d.data()}));
      state.pending = snap.metadata.hasPendingWrites;
      loaded.x = true; ready();
    }, onErr));
  });
}
</script>
</body>
</html>
