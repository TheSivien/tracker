<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a8cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pengeluaran">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Tracker Pengeluaran</title>
<style>
:root{--h1:#1a8cff;--h2:#1f9d63;--bg:#f3f4f9;--card:#fff;--tx:#161a2b;--mut:#7a8199;--bd:#e6e9f2;--pri:#5b5bf0;--pri2:#8b5cf6;--red:#e11d48;--green:#16a34a;--sh:0 4px 20px rgba(30,40,90,.07)}
@media(prefers-color-scheme:dark){:root{--h1:#1a8cff;--h2:#1f9d63;--bg:#0e1118;--card:#171b26;--tx:#eceff8;--mut:#8b93ab;--bd:#262c3c;--pri:#7c7cff;--pri2:#a78bfa;--red:#fb7185;--green:#4ade80;--sh:0 4px 20px rgba(0,0,0,.35)}}
/* tema per akun: Hazim = hijau hutan, Galun = biru terang */
:root[data-theme=hazim]{--h1:#1b6b43;--h2:#3d9962;--pri:#1f7a4d;--pri2:#3d9962;--bg:#eef4ef;--card:#fff;--tx:#13201a;--mut:#667a6e;--bd:#dbe6de;--sh:0 4px 20px rgba(20,60,38,.09)}
:root[data-theme=galun]{--h1:#0764e8;--h2:#12a2ff;--pri:#0a6cff;--pri2:#13a3ff;--bg:#eef5ff;--card:#fff;--tx:#0f1a2e;--mut:#64789a;--bd:#d9e5f7;--sh:0 4px 20px rgba(10,80,200,.10)}
@media(prefers-color-scheme:dark){
:root[data-theme=hazim]{--bg:#0b130e;--card:#131d17;--tx:#e8f2eb;--mut:#86a091;--bd:#223027;--pri:#4cc283;--pri2:#2f9e63;--sh:0 4px 20px rgba(0,0,0,.4)}
:root[data-theme=galun]{--bg:#0a1220;--card:#111b2e;--tx:#e8f0ff;--mut:#8aa0c4;--bd:#1f2d47;--pri:#4da3ff;--pri2:#38bdf8;--sh:0 4px 20px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px 16px 150px;min-height:100vh}
.center{display:grid;place-items:center;min-height:60vh;color:var(--mut);text-align:center;padding:20px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:var(--tx)}
h1,h2,h3{margin:0}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px}
.top h1{font-size:17px;line-height:1.2}
.sync{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:5px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
.sync.p i{background:#f59e0b}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:12px}
.mut{color:var(--mut);font-size:13px}
.sel{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);margin-bottom:14px}
.hero{background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:0 10px 30px color-mix(in srgb,var(--h1) 40%,transparent)}
.hero small{opacity:.85}
.hero .big{font-size:34px;font-weight:800;margin:4px 0}
.hero .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hero .c{background:rgba(255,255,255,.18);border-radius:99px;padding:5px 11px;font-size:13px}
.hero .nb{margin-top:14px;width:100%;background:#fff;color:var(--h1);font-weight:700;padding:11px;border-radius:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.st{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--sh)}
.st small{color:var(--mut);font-size:12px;display:block}
.st b{font-size:15px;display:block;margin:2px 0}
.st span{font-size:11px;color:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:3px;height:130px}
.bars .b{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}
.bars .b i{display:block;width:100%;background:linear-gradient(var(--pri2),var(--pri));border-radius:4px 4px 0 0;min-height:2px}
.bars .b.z i{background:var(--bd)}
.bars .b.t i{outline:2px solid #f59e0b}
.bars .b span{font-size:9px;color:var(--mut);height:12px;margin-top:3px}
.br{margin:10px 0}
.brh{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bar{height:7px;background:var(--bd);border-radius:4px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.donutw{display:flex;gap:16px;align-items:center}
.donut{width:120px;height:120px;border-radius:50%;flex:none;display:grid;place-items:center}
.donut div{width:78px;height:78px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;line-height:1.1}
.donut b{font-size:14px}.donut small{color:var(--mut);font-size:11px}
.leg{flex:1;font-size:13px;min-width:0}
.leg div{display:flex;justify-content:space-between;gap:6px;margin:3px 0}
.leg span{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.ins{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--bd);font-size:14px}
.ins:first-of-type{border-top:0}
.ins em{font-style:normal;font-size:20px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--tx);font-weight:700;box-shadow:var(--sh)}
.rrow{padding:10px 0;border-top:1px solid var(--bd)}
.rrow:first-child{border-top:0}
.rrow .h{display:flex;justify-content:space-between;gap:10px}
.rrow .h b{white-space:nowrap}
.dg{font-size:12px;font-weight:700;color:var(--mut);margin:14px 0 4px;display:flex;justify-content:space-between}
.it{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--bd);width:100%;text-align:left}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none;color:#fff;font-weight:700}
.it .m{flex:1;min-width:0}
.it .m b{display:block}
.it .r{text-align:right;font-weight:700;white-space:nowrap}
.x{color:var(--red);font-size:12px;padding:4px 8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:99px;border:1.5px solid var(--bd);margin:0 6px 8px 0;font-size:14px;background:var(--card)}
.pill.on{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 14%,transparent);font-weight:700}
.pill button{color:var(--red);font-size:16px;line-height:1;padding:0 0 0 2px}
.btn{width:100%;padding:13px;border-radius:13px;font-weight:700;border:1.5px solid var(--bd);background:var(--card);margin-top:8px}
.btn.pri{background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;border:0}
.btn.red{color:var(--red)}
.row{display:flex;gap:8px}
.row>input{flex:1;min-width:0}
.row>button{flex:none;width:auto;margin-top:0;padding:0 16px}
input[type=text],input[type=date],input[type=password]{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--bd);background:var(--bg)}
label.l{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
.nav div{display:flex;width:100%;max-width:560px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mut);padding:6px 0;gap:2px}
.nav button em{font-style:normal;font-size:20px}
.nav button.on{color:var(--pri);font-weight:700}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(76px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;font-size:30px;box-shadow:0 8px 24px color-mix(in srgb,var(--h1) 55%,transparent);z-index:6;display:grid;place-items:center;padding-bottom:3px}
#sheet{display:none}
#sheet.open{display:block}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}
.sh{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));z-index:21;max-height:92vh;overflow:auto}
.grab{width:42px;height:4px;border-radius:2px;background:var(--bd);margin:0 auto 12px}
.sh h3{font-size:18px;margin-bottom:4px}
.amt{display:flex;align-items:center;gap:8px;border:1.5px solid var(--bd);border-radius:14px;padding:4px 14px;background:var(--bg)}
.amt span{color:var(--mut);font-weight:700}
.amt input{border:0;background:none;outline:0;font-size:26px;font-weight:800;width:100%;padding:8px 0}
.err{color:var(--red);font-size:13px;margin-top:8px}
.login{text-align:center;padding-top:60px}
.login h1{font-size:26px;margin-bottom:6px}
.who{display:flex;gap:14px;justify-content:center;margin:26px 0}
.who button{width:130px;padding:20px 10px;border-radius:20px;background:var(--card);box-shadow:var(--sh);border:2px solid transparent;font-weight:700}
.who button.on{border-color:var(--pri)}
.who em{display:grid;place-items:center;width:60px;height:60px;border-radius:50%;margin:0 auto 8px;font-style:normal;font-size:26px;color:#fff;background:linear-gradient(135deg,var(--h1),var(--h2))}
.empty{text-align:center;color:var(--mut);padding:24px 0}
.neg{color:var(--red)}
.hero .two{display:flex;gap:8px;margin-top:14px}
.hero .two button{flex:1;background:#fff;color:var(--h1);font-weight:700;padding:11px;border-radius:12px}
.sw{flex:none;width:52px;height:30px;border-radius:99px;background:var(--bd);position:relative;transition:.2s}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--pri)}
.sw.on i{left:25px}
.shh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.close{flex:none;width:36px;height:36px;border-radius:50%;background:var(--bg);color:var(--mut);font-size:16px;display:grid;place-items:center}
.it{cursor:pointer}
.eb{display:inline-block;font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--bd);color:var(--pri);background:var(--card);margin-top:4px;font-weight:600}
pre{white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:10px;font-size:12px;text-align:left}

/* ===== animasi & efek: hanya transform/opacity supaya ringan ===== */
body{transition:background-color .4s;touch-action:manipulation}
button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.fab,.btn,.pill,.eb,.close,.seg button,.nav button,.who button,.logo,.hero .nb,.hero .two button{transition:transform .14s ease}
.fab:active,.btn:active,.pill:active,.eb:active,.close:active,.seg button:active,.nav button:active,.who button:active,.logo:active,.hero .nb:active,.hero .two button:active{transform:scale(.94)}
.it{transition:background-color .15s}
.it:active{background:color-mix(in srgb,var(--pri) 8%,transparent)}
@media (hover:hover){.st{transition:transform .2s ease}.st:hover{transform:translateY(-2px)}.fab{transition:transform .25s cubic-bezier(.3,1.5,.5,1)}.fab:hover{transform:scale(1.07) rotate(90deg)}}
.who2{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:42px;height:42px;flex:none;padding:3px;border-radius:13px;background:linear-gradient(135deg,var(--h1),var(--h2));box-shadow:0 4px 14px color-mix(in srgb,var(--h1) 40%,transparent)}
.logo svg{display:block;width:100%;height:100%;overflow:visible}
.wing{transform-origin:80px 56px}
.logo.flap .wing{animation:flap .2s ease-in-out 4 alternate}
.biglogo{width:104px;height:104px;margin:0 auto 14px;padding:8px;border-radius:30px;background:linear-gradient(135deg,var(--h1),var(--h2));box-shadow:0 12px 34px color-mix(in srgb,var(--h1) 45%,transparent)}
.biglogo svg{display:block;width:100%;height:100%;overflow:visible;animation:bob 2.8s ease-in-out infinite}
.biglogo .wing{animation:flap .45s ease-in-out infinite alternate}
.sync.p i{animation:pulse 1s ease-in-out infinite}
.pill.on{animation:tap .22s ease}
.hero{position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.3) 50%,transparent 70%);transform:translateX(-120%)}
.bars .b i{transform-origin:bottom}
.bar i{transform-origin:left}
#app.anim > :not(.top):not(.nav):not(.fab){animation:rise .5s cubic-bezier(.2,.8,.2,1) backwards}
#app.anim > :not(.top):not(.nav):not(.fab):nth-child(2){animation-delay:0ms}
#app.anim > :not(.top):not(.nav):not(.fab):nth-child(3){animation-delay:45ms}
#app.anim > :not(.top):not(.nav):not(.fab):nth-child(4){animation-delay:90ms}
#app.anim > :not(.top):not(.nav):not(.fab):nth-child(5){animation-delay:135ms}
#app.anim > :not(.top):not(.nav):not(.fab):nth-child(6){animation-delay:180ms}
#app.anim > :not(.top):not(.nav):not(.fab):nth-child(7){animation-delay:225ms}
#app.anim > :not(.top):not(.nav):not(.fab):nth-child(8){animation-delay:270ms}
#app.anim > :not(.top):not(.nav):not(.fab):nth-child(9){animation-delay:315ms}
#app.anim > :not(.top):not(.nav):not(.fab):nth-child(10){animation-delay:360ms}
#app.anim > :not(.top):not(.nav):not(.fab):nth-child(11){animation-delay:405ms}
#app.anim .hero::after{opacity:1;animation:shine 1.2s .45s ease-out forwards}
#app.anim .bars .b i{animation:grow .6s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--k,0) * 14ms + .15s)}
#app.anim .bar i{animation:growx .7s cubic-bezier(.2,.8,.2,1) backwards .25s}
#app.anim .donut{animation:pop .6s cubic-bezier(.2,1.3,.4,1) backwards .2s}
#app.anim .nav button.on em{animation:bop .45s .1s}
#app.anim .login > *{animation:rise .5s cubic-bezier(.2,.8,.2,1) backwards}
#sheet.fresh .ov{animation:fade .2s}
#sheet.fresh .sh{animation:slideup .3s cubic-bezier(.2,.9,.3,1)}
#sheet.closing .ov{animation:fadeout .17s forwards}
#sheet.closing .sh{animation:slidedown .17s ease-in forwards}
@keyframes flap{from{transform:rotate(-14deg)}to{transform:rotate(12deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
@keyframes tap{50%{transform:scale(1.07)}}
@keyframes shine{to{transform:translateX(120%)}}
@keyframes bop{0%{transform:translateY(0)}40%{transform:translateY(-6px) scale(1.15)}100%{transform:translateY(0)}}
@keyframes fade{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes slideup{from{transform:translateY(100%)}}
@keyframes slidedown{to{transform:translateY(100%)}}
@keyframes pulse{50%{transform:scale(1.7);opacity:.5}}
/* partikel uang (maks. ~70 elemen, dihapus otomatis setelah selesai) */
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.pt,.rn{position:absolute;left:0;top:0;line-height:1;will-change:transform,opacity}
.pt{font-size:22px;animation:fly var(--t,900ms) cubic-bezier(.12,.75,.3,1) forwards}
.rn{font-size:var(--s,24px);left:var(--l);top:-40px;animation:fall var(--t) linear var(--d) forwards}
@keyframes fly{0%{transform:translate3d(var(--x),var(--y),0) scale(.3) rotate(0);opacity:0}12%{opacity:1}100%{transform:translate3d(calc(var(--x) + var(--dx)),calc(var(--y) + var(--dy)),0) scale(1) rotate(var(--r));opacity:0}}
@keyframes fall{0%{transform:translate3d(0,0,0) rotate(0)}100%{transform:translate3d(var(--sw),calc(100vh + 90px),0) rotate(var(--r))}}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;z-index:60;pointer-events:none;transition:transform .25s,opacity .25s;max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0);opacity:1}
/* mode intip: ketuk 2x angka total */
.hero .big,.st b,.brh b,.amt-s,.rrow .h b,.dg span:last-child,.ins b,.leg b{transition:filter .25s}
.priv .hero .big,.priv .st b,.priv .brh b,.priv .amt-s,.priv .rrow .h b,.priv .dg span:last-child,.priv .ins b,.priv .leg b{filter:blur(8px)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.note{display:block;font-style:italic}
.hero .two{gap:6px}.hero .two button{font-size:14px;padding:11px 4px}
</style>
</head>

<div id="sheet"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

/* ====== ISI BAGIAN INI (dari Firebase Console) ====== */
const firebaseConfig = {

  projectId: "our-money-tracker",
  appId: "1:991339455679:web:3c54a5660d31c86786520a"
};
// Akun otomatis dibuat saat pertama kali dipilih. Password dipakai di balik layar (tidak perlu diketik).
// Ganti password di bawah dengan teks acak panjang milikmu sendiri (minimal 6 karakter).
const ACCOUNTS = {
  Hazim: { email: "hazim@tracker.app", pass: "123456" },
  Galun: { email: "galun@tracker.app", pass: "123456" }
};
/* ==================================================== */

const METHODS = { BCA:'#0060af', Mandiri:'#d99a00', BSI:'#00a19b', BNI:'#f26522', Shopeepay:'#ee4d2d', Cash:'#16a34a', Gopay:'#00a5cf' };
const FALLBACK = 'Lainnya';
const DEFAULT_TYPES = ['Makan','Transport','Belanja','Tagihan','Hiburan','Kesehatan',FALLBACK];
const ICON = {Makan:'🍜',Transport:'🚗',Belanja:'🛍️',Tagihan:'🧾',Hiburan:'🎮',Kesehatan:'💊',Lainnya:'📦'};
const PALETTE = ['#6366f1','#f59e0b','#10b981','#ef4444','#06b6d4','#ec4899','#8b5cf6','#84cc16','#f97316','#14b8a6'];
const MONTHS = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const DAYS = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const P = s => { const [a,b,c] = s.split('-').map(Number); return new Date(a,b-1,c,12); };
const today = () => ymd(new Date());
const addDays = (s,n) => { const d = P(s); d.setDate(d.getDate()+n); return ymd(d); };
const diffDays = (a,b) => Math.round((P(b)-P(a))/864e5);
const weekStart = s => addDays(s, -((P(s).getDay()+6)%7));
const dShort = s => { const d = P(s); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };

function applyTheme(name){

// angka total "menghitung naik"
const cnt = { shown:{}, act:{}, raf:0 };
function tick(now){
  let live = false;
  for (const k in cnt.act){
    const a = cnt.act[k], t = Math.min(1,(now-a.t0)/a.dur), v = a.from + (a.to-a.from)*(1-Math.pow(1-t,3));
    cnt.shown[k] = v;
    const el = document.querySelector('[data-ck="'+k+'"]'); if (el) el.textContent = rp(v);
    if (t>=1){ delete cnt.act[k]; cnt.shown[k] = a.to; } else live = true;
  }
  cnt.raf = live ? requestAnimationFrame(tick) : 0;
}
function afterRender(){
  document.querySelectorAll('[data-ck]').forEach(el => {
    const k = el.dataset.ck, v = +el.dataset.count;
    if (REDUCE){ cnt.shown[k] = v; delete cnt.act[k]; el.textContent = rp(v); return; }
    let a = cnt.act[k];
    if (ui.animNow || !a || a.to!==v){
      const from = ui.animNow ? 0 : (cnt.shown[k]===undefined ? v : cnt.shown[k]);
      if (Math.round(from)===Math.round(v)){ delete cnt.act[k]; cnt.shown[k] = v; el.textContent = rp(v); return; }
      a = cnt.act[k] = { from, to:v, t0:performance.now(), dur:800 };
      cnt.shown[k] = from;
    }
    el.textContent = rp(cnt.shown[k]);
  });
  if (!cnt.raf && Object.keys(cnt.act).length) cnt.raf = requestAnimationFrame(tick);
}

let toastT = 0;
function toast(msg){ const t = $('toast'); if (!t) return; t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2300); }

function burst(x,y,emojis,n=8){
  if (REDUCE) return; const fx = $('fx'); if (!fx || fx.childElementCount>70) return;
  const f = document.createDocumentFragment();
  for (let i=0;i<n;i++){
    const s = document.createElement('span'), ang = -Math.PI/2 + (Math.random()-.5)*2.4, dist = 90 + Math.random()*130;
    s.className = 'pt'; s.textContent = emojis[i%emojis.length];
    s.style.cssText = `--x:${x-11}px;--y:${y-11}px;--dx:${Math.cos(ang)*dist}px;--dy:${Math.sin(ang)*dist-30}px;--r:${(Math.random()-.5)*540}deg;--t:${800+Math.random()*500}ms;font-size:${18+Math.random()*10}px`;
    f.appendChild(s);
  }
  fx.appendChild(f);
}
function rain(n=26){
  if (REDUCE) return; const fx = $('fx'); if (!fx || fx.childElementCount>50) return;
  const E = ['💸','💸','💵','🪙','💰'], f = document.createDocumentFragment();

    const s = document.createElement('span'); s.className = 'rn'; s.textContent = E[i%E.length];

    f.appendChild(s);
  }
  fx.appendChild(f);
}
let rb = 0;
function rainbow(){
  toast('🌈 Mode pelangi!');
  if (REDUCE || rb) return;
  const root = document.documentElement, t0 = Date.now(); let h = 0;
  rb = setInterval(() => {
    h = (h+14)%360;
    root.style.setProperty('--h1',`hsl(${h} 80% 42%)`); root.style.setProperty('--h2',`hsl(${(h+50)%360} 85% 52%)`);

}

  applyTheme(state.name);
  ui.viewIdx = Math.max(0, Math.min(ui.viewIdx, state.periods.length-1));
  if (ui.tab==='bal' && !state.balanceOn) ui.tab='home';
  const tabs = [['home','🏠','Beranda'],['recap','📊','Rekap'],['hist','🧾','Riwayat'],['set','⚙️','Pengaturan']];

function homeHTML(){
  const i = ui.viewIdx, isCur = i===state.periods.length-1;
  const L = state.expenses.filter(e=>inP(e,i));
  const total = sum(L), st = periodStart(i), en = periodEnd(i);
  const days = Math.max(1, diffDays(st,en)+1);
  const t = today();
  const all = state.expenses;
  const rangeSum = (a,b) => sum(all.filter(e=>e.date>=a && e.date<=b));
  const w0 = weekStart(t);
  const mk = t.slice(0,7);
  const lm = (()=>{ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); return ymd(d).slice(0,7); })();
  const todayT = rangeSum(t,t), yT = rangeSum(addDays(t,-1),addDays(t,-1));
  const weekT = rangeSum(w0,t), lwT = rangeSum(addDays(w0,-7),addDays(w0,-1));
  const monT = sum(all.filter(e=>e.date.slice(0,7)===mk)), lmT = sum(all.filter(e=>e.date.slice(0,7)===lm));

  let h = periodSelect();
  h += `<div class="hero"><small>${esc(pname(i))}${isCur?' · aktif':''}</small><div class="big" data-ck="hero-${i}" data-count="${total}">${rp(total)}</div>
    <small>${dShort(st)} – ${isCur?'sekarang':dShort(en)} · ${days} hari</small>
    <div class="chips"><span class="c">≈ ${rpS(total/days)}/hari</span><span class="c">${L.length} transaksi</span><button class="c" data-a="renamePeriod" data-i="${i}" style="border:0;color:#fff">✏️ Ubah nama</button></div>
    ${isCur?`<button class="nb" data-a="openPeriod">+ Mulai periode baru</button>`:''}</div>`;
  h += balanceCardHTML();
  h += `<div class="grid3">
    <div class="st"><small>Hari ini</small><b>${rpS(todayT)}</b><span>Kemarin ${rpS(yT)}</span></div>
    <div class="st"><small>Minggu ini</small><b>${rpS(weekT)}</b><span>Lalu ${rpS(lwT)}</span></div>
    <div class="st"><small>Bulan ini</small><b>${rpS(monT)}</b><span>Lalu ${rpS(lmT)}</span></div></div>`;
  if (!L.length) return h + `<div class="card empty">Belum ada pengeluaran di periode ini.<br>Tekan + untuk menambah.</div>`;

  // chart harian
  const byDate = group(L,e=>e.date);
  const from = days>31 ? addDays(en,-30) : st;
  const n = diffDays(from,en)+1;
  const mx = Math.max(...Object.values(byDate),1);
  let bars = '';
  for (let k=0;k<n;k++){
    const d = addDays(from,k), v = byDate[d]||0;
    const lab = (n<=14 || k%5===0 || k===n-1) ? P(d).getDate() : '';
    bars += `<div class="b ${v?'':'z'} ${d===t?'t':''}" style="--k:${k}" title="${dShort(d)}: ${rp(v)}"><i style="height:${v/mx*100}%"></i><span>${lab}</span></div>`;
  }
  h += `<div class="card"><h2>Pengeluaran harian${days>31?' (31 hari terakhir)':''}</h2><div class="bars">${bars}</div></div>`;

  // per tipe
  const byType = Object.entries(group(L,e=>e.type)).sort((a,b)=>b[1]-a[1]);
  let acc = 0;
  const stops = byType.map(([k,v])=>{ const s=acc/total*100; acc+=v; return `${col(k)} ${s}% ${acc/total*100}%`; }).join(',');
  h += `<div class="card"><h2>Per tipe</h2><div class="donutw"><div class="donut" style="background:conic-gradient(${stops})"><div><span><b>${rpS(total)}</b><br><small>total</small></span></div></div>
    <div class="leg">${byType.map(([k,v])=>`<div><span><i class="dot" style="background:${col(k)}"></i>${esc(k)}</span><b>${Math.round(v/total*100)}%</b></div>`).join('')}</div></div>
    <div style="margin-top:8px">${byType.map(([k,v])=>barRow(`${icon(k)} ${esc(k)}`,v,byType[0][1],col(k))).join('')}</div></div>`;

  // per metode
  const byMeth = Object.entries(group(L,e=>e.method)).sort((a,b)=>b[1]-a[1]);
  h += `<div class="card"><h2>Per metode</h2>${byMeth.map(([k,v])=>barRow(esc(k),v,byMeth[0][1],METHODS[k]||'#94a3b8')).join('')}</div>`;

  // per hari dalam minggu
  const wd = [1,2,3,4,5,6,0].map(d=>[DAYS[d], sum(L.filter(e=>P(e.date).getDay()===d))]);
  const wmx = Math.max(...wd.map(x=>x[1]),1);
  h += `<div class="card"><h2>Per hari dalam seminggu</h2><div class="bars" style="height:100px">${wd.map(([l,v],q)=>`<div class="b ${v?'':'z'}" style="--k:${q*3}"><i style="height:${v/wmx*100}%"></i><span>${l}</span></div>`).join('')}</div></div>`;

  // sorotan
  const topDay = Object.entries(byDate).sort((a,b)=>b[1]-a[1])[0];
  const big = L.slice().sort((a,b)=>b.amount-a.amount);
  h += `<div class="card"><h2>Sorotan</h2>
    <div class="ins"><em>🔥</em><div>Hari terboros<br><b>${dFull(topDay[0])}</b> · ${rp(topDay[1])}</div></div>
    <div class="ins"><em>💎</em><div>Transaksi terbesar<br><b>${rp(big[0].amount)}</b> · ${esc(big[0].type)} (${dShort(big[0].date)})</div></div>
    <div class="ins"><em>🧮</em><div>Rata-rata per transaksi<br><b>${rp(total/L.length)}</b></div></div>
    <div class="ins"><em>📅</em><div>Hari aktif belanja<br><b>${Object.keys(byDate).length}</b> dari ${days} hari</div></div></div>`;
  h += `<div class="card"><h2>5 terbesar</h2>${big.slice(0,5).map(itemHTML).join('')}</div>`;
  h += `<button class="btn" data-a="toggleMore">${ui.more?'Sembunyikan ▴':'Tampilkan lebih ▾'}</button>`;
  if (ui.more) h += moreHTML({L,i,total,days,st,byDate});
  return h;
}

    const mv = x.kind==='move', tm = `${dShort(ymd(d))} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    return `<div class="rrow"><div class="h"><div>${mv?`Transfer ${esc(x.m)} → ${esc(x.to)}`:`${x.kind==='add'?'Tambah saldo':'Edit saldo'} · ${esc(x.m)}`}<div class="mut">${tm}${mv?'':` · ${x.kind==='add'?'jadi '+rp(x.after):'sebelumnya '+rp(x.before)}`}</div></div><b>${mv?'⇄ '+rp(x.amount):x.kind==='add'?'+ '+rp(x.amount):rp(x.after)}</b></div></div>`;

function balPreview(){

  return `Saldo ${f.method}: ${show(cur)} → ${f.amount===''?'…':rp(after)}`;
}

function moreHTML(c){
  const {L,i,total,days,st,byDate} = c;
  let h = '';
  // dibanding periode sebelumnya
  if (i>0){
    const tp = sum(state.expenses.filter(e=>inP(e,i-1)));
    const dp = Math.max(1, diffDays(periodStart(i-1),periodEnd(i-1))+1);
    const avg = total/days, avgP = tp/dp;
    const pct = avgP ? Math.round((avg-avgP)/avgP*100) : null;
    h += `<div class="card"><h2>Dibanding ${esc(pname(i-1))}</h2>
      <div class="ins"><em>📆</em><div>Rata-rata per hari<br><b>${rp(avg)}</b> vs ${rp(avgP)}${pct===null?'':` <span class="mut">(${pct>0?'+':''}${pct}%)</span>`}</div></div>
      <div class="ins"><em>💰</em><div>Total<br><b>${rp(total)}</b> vs ${rp(tp)}</div></div>
      <div class="mut" style="margin-top:6px">Total dipengaruhi lama periode, jadi rata-rata per hari lebih adil untuk dibandingkan.</div></div>`;
  }
  // loop harian
  let run = 0, zero = 0, streak = 0, best = 0, wkDays = 0, weDays = 0;
  const cum = [];
  for (let k=0;k<days;k++){
    const d = addDays(st,k), v = byDate[d]||0, dow = P(d).getDay();
    run += v; cum.push([d,run]);
    if (!v){ zero++; streak++; best = Math.max(best,streak); } else streak = 0;
    if (dow===0||dow===6) weDays++; else wkDays++;
  }
  const weTotal = sum(L.filter(e=>{const g=P(e.date).getDay();return g===0||g===6;}));
  const wkTotal = total - weTotal;
  const am = L.map(e=>e.amount).sort((a,b)=>a-b);
  const med = am.length%2 ? am[(am.length-1)/2] : (am[am.length/2-1]+am[am.length/2])/2;
  const spendDays = Object.entries(byDate).sort((a,b)=>a[1]-b[1]);
  const cnt = fn => { const m={}; L.forEach(e=>{const k=fn(e);m[k]=(m[k]||0)+1;}); return Object.entries(m).sort((a,b)=>b[1]-a[1])[0]; };
  const topT = cnt(e=>e.type), topM = cnt(e=>e.method);

  h += `<div class="card"><h2>Statistik lainnya</h2>
    <div class="ins"><em>🧘</em><div>Hari tanpa pengeluaran<br><b>${zero}</b> dari ${days} hari · terpanjang berturut-turut <b>${best}</b> hari</div></div>
    <div class="ins"><em>🌱</em><div>Hari terhemat (yang ada pengeluaran)<br><b>${dFull(spendDays[0][0])}</b> · ${rp(spendDays[0][1])}</div></div>
    <div class="ins"><em>📏</em><div>Median per transaksi<br><b>${rp(med)}</b> · terkecil ${rp(am[0])}</div></div>
    <div class="ins"><em>🗓️</em><div>Rata-rata per minggu<br><b>${rp(total/days*7)}</b></div></div>
    <div class="ins"><em>🏖️</em><div>Akhir pekan vs hari kerja (per hari)<br><b>${weDays?rp(weTotal/weDays):'–'}</b> vs <b>${wkDays?rp(wkTotal/wkDays):'–'}</b> · akhir pekan ${Math.round(weTotal/total*100)}% dari total</div></div>
    <div class="ins"><em>🏷️</em><div>Tipe paling sering<br><b>${esc(topT[0])}</b> · ${topT[1]}x</div></div>
    <div class="ins"><em>💳</em><div>Metode paling sering<br><b>${esc(topM[0])}</b> · ${topM[1]}x</div></div></div>`;

  // akumulasi
  const shown = cum.slice(-31);
  h += `<div class="card"><h2>Akumulasi pengeluaran${cum.length>31?' (31 hari terakhir)':''}</h2><div class="bars">${shown.map(([d,v],k)=>{
    const lab = (shown.length<=14 || k%5===0 || k===shown.length-1) ? P(d).getDate() : '';
    return `<div class="b" style="--k:${k}" title="${dShort(d)}: ${rp(v)}"><i style="height:${total?v/total*100:0}%"></i><span>${lab}</span></div>`;
  }).join('')}</div><div class="mut" style="margin-top:6px">Total berjalan sejak awal periode.</div></div>`;

  // ukuran transaksi
  const bk = [['< Rp 25 rb',0,25e3],['Rp 25 rb – 100 rb',25e3,1e5],['Rp 100 rb – 500 rb',1e5,5e5],['≥ Rp 500 rb',5e5,Infinity]]
    .map(([l,a,b])=>[l,L.filter(e=>e.amount>=a&&e.amount<b).length]);
  const bmx = Math.max(...bk.map(x=>x[1]),1);
  h += `<div class="card"><h2>Ukuran transaksi</h2>${bk.map(([l,n])=>`<div class="br"><div class="brh"><span>${l}</span><b>${n} transaksi</b></div><div class="bar"><i style="width:${n/bmx*100}%;background:var(--pri)"></i></div></div>`).join('')}</div>`;
  return h;
}

function recapHTML(){
  const i = ui.viewIdx, L = state.expenses.filter(e=>inP(e,i));
  const mode = ui.recap;
  let rows = [], note = '';
  if (mode==='day'){
    const m = group(L,e=>e.date), c = {}; L.forEach(e=>c[e.date]=(c[e.date]||0)+1);
    rows = Object.keys(m).sort().reverse().map(d=>({label:dFull(d),sub:`${c[d]} transaksi`,total:m[d]}));
    note = esc(pname(i));
  } else if (mode==='week'){
    const m = group(L,e=>weekStart(e.date)), c = {}; L.forEach(e=>{const k=weekStart(e.date);c[k]=(c[k]||0)+1;});
    rows = Object.keys(m).sort().reverse().map(w=>({label:`${dShort(w)} – ${dShort(addDays(w,6))}`,sub:`${c[w]} transaksi`,total:m[w]}));
    note = esc(pname(i)) + ' · minggu Senin–Minggu';
  } else if (mode==='month'){
    const m = group(state.expenses,e=>e.date.slice(0,7)), c = {}; state.expenses.forEach(e=>{const k=e.date.slice(0,7);c[k]=(c[k]||0)+1;});
    rows = Object.keys(m).sort().reverse().map(k=>({label:`${['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][+k.slice(5)-1]} ${k.slice(0,4)}`,sub:`${c[k]} transaksi`,total:m[k]}));
    note = 'Semua data';
  } else {
    rows = state.periods.map((p,k)=>{const l=state.expenses.filter(e=>inP(e,k));return {label:esc(pname(k)),sub:`${dShort(periodStart(k))} – ${k===state.periods.length-1?'sekarang':dShort(periodEnd(k))} · ${l.length} transaksi`,total:sum(l)};}).reverse();
    note = 'Semua periode';
  }
  const mx = Math.max(...rows.map(r=>r.total),1), tot = sum(rows.map(r=>({amount:r.total})));
  const seg = [['day','Harian'],['week','Mingguan'],['month','Bulanan'],['period','Periode']].map(([k,l])=>`<button class="${mode===k?'on':''}" data-a="recap" data-v="${k}">${l}</button>`).join('');
  return `${mode==='day'||mode==='week'?periodSelect():''}<div class="seg">${seg}</div>
    <div class="card"><h2>Rekap · ${note}</h2>
    ${rows.length?`<div class="mut" style="margin:-4px 0 6px">Rata-rata ${rp(tot/rows.length)} per ${({day:'hari',week:'minggu',month:'bulan',period:'periode'})[mode]}</div>
    ${rows.map(r=>`<div class="rrow"><div class="h"><div>${r.label}<div class="mut">${r.sub}</div></div><b>${rp(r.total)}</b></div><div class="bar"><i style="width:${r.total/mx*100}%;background:var(--pri)"></i></div></div>`).join('')}`:'<div class="empty">Belum ada data.</div>'}</div>`;
}

function histList(){
  const q = ui.q.trim().toLowerCase();
  let L = q ? state.expenses.slice() : state.expenses.filter(e=>inP(e,ui.viewIdx));   // saat mencari: semua periode
  if (ui.filter) L = L.filter(e=>e.type===ui.filter);
  if (q) L = L.filter(e => (e.type+' '+e.method+' '+(e.note||'')+' '+e.amount+' '+e.date).toLowerCase().includes(q));
  L.sort((a,b)=>b.date.localeCompare(a.date) || (b.createdAt||0)-(a.createdAt||0));
  const dates = [...new Set(L.map(e=>e.date))];
  const head = q ? `<div class="mut" style="margin:0 2px 8px">${L.length} hasil di semua periode · ${rp(sum(L))}</div>` : '';
  return head + (dates.length ? dates.map(d=>{
    const day = L.filter(e=>e.date===d);
    return `<div class="card" style="padding:6px 16px 8px"><div class="dg"><span>${dFull(d)}</span><span>${rp(sum(day))}</span></div>${day.map(itemHTML).join('')}</div>`;
  }).join('') : '<div class="card empty">Tidak ada transaksi.</div>');
}

  sh.classList.remove('closing');
  sh.innerHTML = ({exp:expenseSheet,per:periodSheet,ren:renameSheet,bal:balanceSheet})[form.kind]();
  sh.classList.toggle('fresh', !was);   // animasi geser hanya saat pertama dibuka, bukan tiap ketukan
  sh.classList.add('open'); document.body.style.overflow='hidden';
}
const sheetEl = () => $('sheet');
function closeSheet(){
  const sh = sheetEl(); form = null; document.body.style.overflow = '';
  if (REDUCE || !sh.classList.contains('open')){ sh.classList.remove('open','fresh','closing'); sh.innerHTML = ''; return; }
  sh.classList.add('closing');
  setTimeout(() => { if (form) return; sh.classList.remove('open','fresh','closing'); sh.innerHTML = ''; }, 170);
}

/* ---------- actions ---------- */
const fail = e => { console.error(e); alert('Gagal menyimpan: ' + (e.message||e)); };
const A = {
  tab:d=>{ if (ui.tab!==d.v) animate(); ui.tab=d.v; render(); window.scrollTo(0,0); },
  recap:d=>{ if (ui.recap!==d.v) animate(); ui.recap=d.v; render(); },
  logo:(d,el)=>{
    if (lpFired){ lpFired = false; return; }
    el.classList.remove('flap'); void el.offsetWidth; el.classList.add('flap');
    const r = el.getBoundingClientRect(); burst(r.left+r.width/2, r.top+r.height/2, ['💸'], 2);
    logoTaps++; clearTimeout(logoT); logoT = setTimeout(()=>{ logoTaps = 0; }, 2500);
    if (logoTaps===4) toast('Terus… 👀');
    if (logoTaps>=7){ logoTaps = 0; rain(); toast('🤑 Hujan uang!'); }
  },
  openAdd:()=>{
    form = {kind:'exp',id:null,dmode:'today',date:today(),type:localStorage.getItem('lastType')&&state.types.includes(localStorage.getItem('lastType'))?localStorage.getItem('lastType'):state.types[0],amount:'',method:localStorage.getItem('lastMethod')||'BCA',note:'',newType:'',err:''};
    showSheet();
  },
  edit:d=>{
    const e = state.expenses.find(x=>x.id===d.id); if(!e) return;
    form = {kind:'exp',id:e.id,dmode:e.date===today()?'today':'custom',date:e.date,type:e.type,amount:String(e.amount),method:e.method,note:e.note||'',newType:'',err:''};
    showSheet();
  },
  closeSheet,
  dmode:d=>{ form.dmode=d.v; if(d.v==='custom'&&!form.date) form.date=today(); showSheet(); },
  pickType:d=>{ form.type=d.v; showSheet(); },
  pickMethod:d=>{ form.method=d.v; showSheet(); },
  addType:()=>{
    const v = (form.newType||'').trim(); if(!v) return;
    const ex = state.types.find(t=>t.toLowerCase()===v.toLowerCase());
    if (ex) form.type = ex; else { addType(v); form.type = v; }
    form.newType=''; showSheet();
  },
  addTypeS:()=>{ const v=$('sNew').value.trim(); if(v){ const ex=state.types.find(t=>t.toLowerCase()===v.toLowerCase()); if(!ex) addType(v); render(); } },
  delType:async d=>{
    if(!confirm(`Hapus tipe "${d.v}"? Pengeluaran dengan tipe ini dipindah ke "${FALLBACK}".`)) return;
    const aff = state.expenses.filter(e=>e.type===d.v);
    state.types = state.types.filter(t=>t!==d.v); if(!state.types.includes(FALLBACK)) state.types.push(FALLBACK);
    aff.forEach(e=>e.type=FALLBACK);
    render();
    try{
      for (let i=0;i<aff.length;i+=400){ const b=writeBatch(db); aff.slice(i,i+400).forEach(e=>b.update(doc(db,'users',state.uid,'expenses',e.id),{type:FALLBACK})); b.commit().catch(fail); }
      updateDoc(userRef(),{types:state.types}).catch(fail);
    }catch(e){ fail(e); }
  },
  saveExpense:(d,el)=>{
    const amt = parseInt(form.amount,10), date = form.dmode==='today'?today():form.date;
    if(!amt){ form.err='Isi besaran dulu.'; return showSheet(); }
    if(!date){ form.err='Pilih tanggal.'; return showSheet(); }
    const data = {date,type:form.type,amount:amt,method:form.method,note:(form.note||'').trim().slice(0,80)};
    localStorage.setItem('lastType',form.type); localStorage.setItem('lastMethod',form.method);
    if (form.id) updateDoc(doc(db,'users',state.uid,'expenses',form.id),data).catch(fail);
    else addDoc(expCol(),{...data,createdAt:Date.now()}).catch(fail);
    ui.viewIdx = periodIdxOf(date);
    const isNew = !form.id, method = form.method, rc = el && el.getBoundingClientRect ? el.getBoundingClientRect() : null;
    const cx = rc ? rc.left+rc.width/2 : innerWidth/2, cy = rc ? rc.top : innerHeight*0.6;
    const projected = isNew && state.balanceOn && balOf(method)!==null ? balOf(method) - amt : null;
    closeSheet(); render();
    if (isNew){
      const big = amt>=500000, tiny = amt<=10000;
      burst(cx, cy, big?['💸','💸','💸','😱']:tiny?['🪙','✨']:['💸','💵','🪙'], big?12:8);
      toast(big?'Wah, gede juga! 💸 Dompet menjerit':tiny?'Hemat! 🪙 Receh pun dicatat':'Tersimpan ✓');
      if (projected!==null && projected<0) setTimeout(()=>toast('Saldo '+method+' jadi minus 😱'), 1700);
      if (navigator.vibrate) navigator.vibrate(12);
    }
  },
  delExp:()=>{ if(!confirm('Hapus pengeluaran ini?')) return; deleteDoc(doc(db,'users',state.uid,'expenses',form.id)).catch(fail); closeSheet(); },
  openPeriod:()=>{ form={kind:'per',pmode:'today',date:today(),err:''}; showSheet(); },
  toggleBal:()=>{
    state.balanceOn = !state.balanceOn;
    if (!state.balanceOn && ui.tab==='bal') ui.tab='home';
    updateDoc(userRef(),{balanceOn:state.balanceOn}).catch(fail); render();
  },
  openBal:d=>{
    const ks = Object.keys(METHODS), from = d.m||ks[0];
    form = {kind:'bal',mode:d.mode==='set'?'set':d.mode==='move'?'move':'add',method:from,to:ks.find(k=>k!==from),amount:'',err:''}; showSheet();
  },
  bMode:d=>{ form.mode=d.v; form.err=''; showSheet(); },
  bMethod:d=>{ if (d.v===form.to) form.to = form.method; form.method=d.v; form.err=''; showSheet(); },
  bTo:d=>{ if (d.v===form.method) form.method = form.to; form.to=d.v; form.err=''; showSheet(); },
  saveBal:()=>{
    const f = form, m = f.method, amt = parseInt(f.amount,10);
    if (f.amount==='' || isNaN(amt)){ f.err='Isi nominal dulu.'; return showSheet(); }
    if (f.mode==='move'){
      if (amt<=0){ f.err='Jumlah harus lebih dari 0.'; return showSheet(); }
      if (f.method===f.to){ f.err='Pilih dua metode yang berbeda.'; return showSheet(); }
      if (balOf(f.method)===null){ f.err='Saldo '+f.method+' belum diisi. Isi dulu lewat Edit saldo.'; return showSheet(); }
      const a = balOf(f.method), c = balOf(f.to)||0, now = Date.now(), to = f.to;
      const A1 = {base:a-amt,at:now}, B1 = {base:c+amt,at:now};
      state.balances = {...state.balances,[m]:A1,[to]:B1};
      state.balanceLog = [{t:now,m,to,kind:'move',amount:amt,before:a,after:a-amt}, ...state.balanceLog].slice(0,100);
      updateDoc(userRef(),{[`balances.${m}`]:A1,[`balances.${to}`]:B1,balanceLog:state.balanceLog}).catch(fail);
      closeSheet(); render(); toast('Transfer berhasil ⇄'); return;
    }
    if (f.mode==='add' && amt<=0){ f.err='Jumlah yang ditambahkan harus lebih dari 0.'; return showSheet(); }
    const cur = balOf(m)||0, base = f.mode==='add' ? cur+amt : amt, now = Date.now();
    state.balances = {...state.balances, [m]:{base,at:now}};
    state.balanceLog = [{t:now,m,kind:f.mode,amount:amt,before:cur,after:base}, ...state.balanceLog].slice(0,100);
    updateDoc(userRef(),{[`balances.${m}`]:{base,at:now},balanceLog:state.balanceLog}).catch(fail);
    closeSheet(); render();
  },
  toggleMore:()=>{ ui.more=!ui.more; render(); },
  renamePeriod:d=>{ form={kind:'ren',i:+d.i,name:state.periodNames[+d.i]||'',err:''}; showSheet(); },
  saveRename:()=>{
    const names = state.periodNames.slice(); while(names.length<state.periods.length) names.push('');
    names[form.i] = (form.name||'').trim().slice(0,40);
    state.periodNames = names;
    updateDoc(userRef(),{periodNames:names}).catch(fail);
    closeSheet(); render();
  },
  editStart:()=>{ form={kind:'per',edit:true,date:state.periods[state.periods.length-1],err:''}; showSheet(); },
  pmode:d=>{ form.pmode=d.v; form.err=''; showSheet(); },
  savePeriod:()=>{
    if (form.edit){
      const prev = state.periods[state.periods.length-2], d = form.date;
      if(!d){ form.err='Pilih tanggal.'; return showSheet(); }
      if(d>today()){ form.err='Tanggal tidak boleh di masa depan.'; return showSheet(); }
      if(prev && d<=prev){ form.err=`Tanggal harus setelah awal periode sebelumnya (${dShort(prev)}).`; return showSheet(); }
      state.periods = [...state.periods.slice(0,-1), d]; ui.viewIdx = state.periods.length-1;
      savePeriods();
      closeSheet(); render(); return;
    }
    const last = state.periods[state.periods.length-1], d = form.pmode==='today'?today():form.date;
    if(!d) { form.err='Pilih tanggal.'; return showSheet(); }
    if(d>today()){ form.err='Tanggal tidak boleh di masa depan.'; return showSheet(); }
    if(d<=last){ form.err=`Tanggal harus setelah awal periode aktif (${dShort(last)}).`; return showSheet(); }
    state.periods = [...state.periods,d]; ui.viewIdx = state.periods.length-1;
    savePeriods();
    closeSheet(); render();
  },
  undoPeriod:()=>{
    if(!confirm('Batalkan periode terakhir? Transaksinya digabung kembali ke periode sebelumnya.')) return;
    state.periods = state.periods.slice(0,-1); ui.viewIdx = state.periods.length-1;
    savePeriods(); render();
  },
  logout:()=>signOut(auth),
  pickUser:async d=>{
    ui.loginUser=d.v; ui.err=''; view='loading'; render();
    const {email,pass} = ACCOUNTS[d.v];
    try{
      try{ await signInWithEmailAndPassword(auth,email,pass); }
      catch(e){
        // akun belum ada → buat otomatis
        if (['auth/invalid-credential','auth/user-not-found','auth/invalid-login-credentials'].includes(e.code)) await createUserWithEmailAndPassword(auth,email,pass);
        else throw e;
      }
      localStorage.setItem('lastUser',d.v);
    }catch(e){
      console.error(e); view='login';
      ui.err = e.code==='auth/email-already-in-use' ? 'Password di file tidak cocok dengan akun yang sudah ada.' :
               e.code==='auth/operation-not-allowed' ? 'Aktifkan Email/Password di Firebase → Authentication → Sign-in method.' :
               'Gagal masuk: '+esc(e.code||e.message||e);
      render();
    }
  },
  exportCsv:()=>{
    const q = v => `"${String(v).replace(/"/g,'""')}"`;
    const rows = [['Tanggal','Tipe','Metode','Jumlah','Periode']].concat(state.expenses.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>[e.date,e.type,e.method,e.amount,pname(periodIdxOf(e.date))]));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));
    a.download = `pengeluaran-${state.name}-${today()}.csv`; a.click();
  }
};
function savePeriods(){
  const n = state.periodNames.slice(0,state.periods.length); while(n.length<state.periods.length) n.push('');
  state.periodNames = n;
  return updateDoc(userRef(),{periods:state.periods,periodNames:n}).catch(fail);
}
function addType(v){
  const t = state.types.slice(); const i = t.indexOf(FALLBACK);
  t.splice(i<0?t.length:i,0,v); state.types = t;
  updateDoc(userRef(),{types:t}).catch(fail);
}

const app = $('app');
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if(!el) return;
  e.preventDefault(); const f = A[el.dataset.a]; if(f) f(el.dataset, el);
});
document.addEventListener('input', e => {
  if (e.target.id==='fAmt'){ const v=e.target.value.replace(/\D/g,''); e.target.value=v; form.amount=v; $('fPrev').textContent = v?rp(v):''; eggAmount(v); }
  else if (e.target.id==='fNew') form.newType = e.target.value;
  else if (e.target.id==='rName') form.name = e.target.value;
  else if (e.target.id==='fNote') form.note = e.target.value;
  else if (e.target.id==='qSearch'){ ui.q = e.target.value; $('hList').innerHTML = histList(); }
  else if (e.target.id==='bAmt'){ const v=e.target.value.replace(/\D/g,''); e.target.value=v; form.amount=v; $('bPrev').innerHTML = balPreview(); }
});
document.addEventListener('change', e => {
  const c = e.target.dataset.c;
  if (c==='viewIdx'){ ui.viewIdx=+e.target.value; animate(); render(); }
  else if (c==='filter'){ ui.filter=e.target.value; render(); }
  else if (e.target.id==='fDate') form.date = e.target.value;
  else if (e.target.id==='pDate'){ form.date = e.target.value; form.err=''; showSheet(); }
});

document.addEventListener('keydown', e => {
  if (e.key==='Escape' && form) closeSheet();
  else if ((e.key==='Enter'||e.key===' ') && e.target.classList && e.target.classList.contains('it')){ e.preventDefault(); A.edit(e.target.dataset); }
});

/* ---------- easter egg ---------- */
let logoTaps = 0, logoT = 0, lpT = 0, lpFired = false, lastHero = 0, kbuf = [];
const KONAMI = 'ArrowUp,ArrowUp,ArrowDown,ArrowDown,ArrowLeft,ArrowRight,ArrowLeft,ArrowRight,b,a';
document.addEventListener('pointerdown', e => { if (e.target.closest && e.target.closest('.logo')){ clearTimeout(lpT); lpT = setTimeout(()=>{ lpFired = true; rainbow(); }, 650); } });
['pointerup','pointercancel'].forEach(t => document.addEventListener(t, () => { clearTimeout(lpT); setTimeout(()=>{ lpFired = false; }, 60); }));
document.addEventListener('click', e => {
  if (!e.target.closest || !e.target.closest('.hero .big')) return;
  const n = Date.now();
  if (n-lastHero<380){ lastHero = 0; setPriv(!document.body.classList.contains('priv')); } else lastHero = n;
});
document.addEventListener('keydown', e => {
  kbuf.push(e.key.length===1 ? e.key.toLowerCase() : e.key); kbuf = kbuf.slice(-10);
  if (kbuf.join()===KONAMI){ kbuf = []; rainbow(); rain(); }
});
if ($('fx')) $('fx').addEventListener('animationend', e => { if (e.target.parentNode===e.currentTarget) e.target.remove(); });
applyTheme(ui.loginUser);

/* ---------- PWA ---------- */
if (typeof navigator!=='undefined' && 'serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

/* ---------- firebase ---------- */
if (firebaseConfig.apiKey === 'ISI_DISINI'){ view='config'; render(); }
else {
  const fbApp = initializeApp(firebaseConfig);
  auth = getAuth(fbApp);
  db = initializeFirestore(fbApp, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  let loaded = {u:false,x:false};
  const ready = () => {
    if (loaded.u && loaded.x){
      const first = view!=='app';
      if (first){ view='app'; ui.viewIdx = state.periods.length-1; animate(); render(); }
      else rerender();
      // jalan pintas: buka aplikasi dengan ?add=1 langsung menampilkan form tambah pengeluaran
      if (first && new URLSearchParams(location.search).get('add')==='1'){
        history.replaceState(null,'',location.pathname);
        A.openAdd();
      }
    }
  };
  const onErr = e => { console.error(e); view='error'; ui.err='Tidak bisa membaca data. Cek Firestore rules & koneksi.<br><small>'+esc(e.message||e)+'</small>'; render(); };
  onAuthStateChanged(auth, user => {
    unsubs.forEach(f=>f()); unsubs=[]; loaded={u:false,x:false};
    if (!user){ view='login'; ui.tab='home'; ui.filter=''; ui.q=''; ui.more=false; state={name:'',uid:'',periods:[],periodNames:[],types:[],expenses:[],pending:false,balances:{},balanceLog:[],balanceOn:false}; render(); return; }
    state.uid = user.uid;
    state.name = Object.keys(ACCOUNTS).find(k=>ACCOUNTS[k].email===user.email) || user.email;
    view='loading'; render();
    unsubs.push(onSnapshot(userRef(), snap => {
      if (!snap.exists()){ setDoc(userRef(),{periods:[today()],periodNames:[''],types:DEFAULT_TYPES}).catch(onErr); return; }
      const d = snap.data();
      state.periods = [...d.periods].sort();
      state.balances = d.balances || {}; state.balanceLog = d.balanceLog || []; state.balanceOn = !!d.balanceOn;
      state.periodNames = state.periods.map((_,k)=>(Array.isArray(d.periodNames)&&d.periodNames[k])||'');
      state.types = d.types && d.types.length ? d.types : DEFAULT_TYPES;
      loaded.u = true; ready();
    }, onErr));
    unsubs.push(onSnapshot(expCol(), snap => {
      state.expenses = snap.docs.map(d=>({id:d.id,...d.data()}));
      state.pending = snap.metadata.hasPendingWrites;
      loaded.x = true; ready();
    }, onErr));
  });
}
</script>
